name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Set up test environment
        run: docker compose up -d
      - name: Test
        run: dotnet test --no-restore --verbosity normal

      - name: Pack
        run: |
          dotnet pack --no-build --configuration Release DapperBulkQueries.Common/DapperBulkQueries.Common.csproj --output ./nupkgs
          dotnet pack --no-build --configuration Release DapperBulkQueries.Npgsql/DapperBulkQueries.Npgsql.csproj --output ./nupkgs
          dotnet pack --no-build --configuration Release DapperBulkQueries.SqlServer/DapperBulkQueries.SqlServer.csproj --output ./nupkgs

      - name: Upload packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job can see the NuGet key. Store it as an environment secret on
    # the "nuget" environment and restrict that environment to the main branch.
    environment: nuget
    permissions: {}

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: nupkgs

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
